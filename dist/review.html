<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tivoro / Editorial Studio — All seven pages</title><style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#e4e9d9;color:#26372d;font:13px/1.4 Arial,sans-serif}button,a{font:inherit;color:inherit;cursor:pointer}button{border:0;background:transparent}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #304b3c;outline-offset:4px}header{padding:19px 28px;display:flex;align-items:center;justify-content:space-between;gap:30px;background:#f7f5ef}.brand{font:38px/.9 Georgia,serif;letter-spacing:-2px}.brand small{font:11px Arial,sans-serif;letter-spacing:0;margin-left:20px;color:#60695f}.meta{font-size:10px;color:#60695f;text-transform:uppercase;letter-spacing:1px}.page-nav{display:flex;gap:30px;overflow:auto;flex-shrink:0;padding:7px 28px 0;background:#f7f5ef;border-bottom:1px solid #ccc6b9}.page-nav button{white-space:nowrap;padding:14px 0;border-bottom:2px solid transparent;font-size:12px}.page-nav button[aria-current=page]{border-color:#304b3c;color:#304b3c}.page-nav button span{font-size:9px;margin-right:8px;color:#7a766c}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:15px 28px;flex-shrink:0}.toolbar h1{font:27px/1.1 Georgia,serif;margin:0;letter-spacing:-.7px}.toolbar p{font-size:9px;letter-spacing:.8px;color:#60695f;text-transform:uppercase;margin:6px 0 0}.controls{display:flex;gap:18px;align-items:center;font-size:11px}.controls button{font-size:11px;padding:8px 0}.controls button[aria-pressed=true]{text-decoration:underline;text-underline-offset:5px}.controls a{border-bottom:1px solid #26372d;padding:8px 0}.controls .arrow{font-size:18px}.canvas{min-height:0;flex:1;overflow:auto;padding:5px 28px 28px}.paper{width:100%;max-width:1265px;margin:auto;box-shadow:0 3px 26px #26372d18;background:#f7f5ef}.paper.actual{width:1265px;max-width:none}.paper img{display:block;width:100%;height:auto}footer{flex-shrink:0;padding:11px 28px;border-top:1px solid #ccc6b9;font-size:9px;color:#60695f;display:flex;justify-content:space-between;gap:20px;background:#f7f5ef}.controls button:disabled{opacity:.3;cursor:default}@media(max-width:700px){header{padding:18px 20px}.brand{font-size:33px}.brand small{display:block;font-size:9px;margin:7px 0 0}.meta{font-size:8px;max-width:13ch;text-align:right}.page-nav{padding-inline:20px;gap:25px}.page-nav button{font-size:11px}.toolbar{padding:15px 20px;flex-wrap:wrap;gap:12px}.toolbar h1{font-size:24px}.controls{gap:17px}.canvas{padding:0 10px 15px}footer{padding-inline:20px;font-size:8px}}
</style></head><body><header><div class="brand">tivoro<small>An editorial direction for the whole website.</small></div><div class="meta">Seven pages / Full-length designs</div></header><nav class="page-nav" aria-label="Preview pages"></nav><div class="toolbar"><div><h1 id="title"></h1><p id="page-info"></p></div><div class="controls"><button class="arrow" id="prev" aria-label="Previous page">←</button><button class="arrow" id="next" aria-label="Next page">→</button><button id="fit" aria-pressed="true">Fit width</button><button id="actual" aria-pressed="false">100%</button><a id="live" target="_blank" rel="noopener noreferrer">Open page ↗</a><a id="save" download>Save image ↗</a></div></div><main class="canvas" id="canvas"><div class="paper" id="paper"><img id="screen" alt="" decoding="sync"></div></main><footer><span>Ivory. Olive. Ideas made real.</span><span id="count"></span></footer><script>
const pages=[{"slug": "index", "title": "Home", "number": 1}, {"slug": "website-design-development", "title": "Website Design & Development", "number": 2}, {"slug": "product-design-development", "title": "Product Design & Development", "number": 3}, {"slug": "tools-analytics", "title": "Tools & Analytics", "number": 4}, {"slug": "work", "title": "Our Work", "number": 5}, {"slug": "about", "title": "Our Story & Founders", "number": 6}, {"slug": "contact", "title": "Contact", "number": 7}],images=null,shortNames=['Home','Websites','Products','Tools & analytics','Work','Studio','Contact'];let current=0;const $=id=>document.getElementById(id),buttons=[];pages.forEach((p,i)=>{const b=document.createElement('button');b.innerHTML='<span>0'+p.number+'</span>'+shortNames[i];b.onclick=()=>{current=i;render()};document.querySelector('.page-nav').append(b);buttons.push(b)});function render(){const p=pages[current],file='screenshots/'+String(p.number).padStart(2,'0')+'-'+p.slug+'.jpg',src=images?images[p.slug]:file;$('screen').src=src;$('screen').alt='Tivoro — '+p.title+' — complete editorial page';$('title').textContent=p.title;$('page-info').textContent='Header to footer / Scroll to explore';$('live').href='./'+p.slug+'.html';$('save').href=src;$('save').download=String(p.number).padStart(2,'0')+'-'+p.slug+'.jpg';$('count').textContent='0'+p.number+' / '+String(pages.length).padStart(2,'0');$('prev').disabled=current===0;$('next').disabled=current===pages.length-1;buttons.forEach((b,i)=>{if(i===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('canvas').scrollTop=0;$('canvas').scrollLeft=0}function zoom(v){$('paper').classList.toggle('actual',v);$('fit').setAttribute('aria-pressed',String(!v));$('actual').setAttribute('aria-pressed',String(v))}$('fit').onclick=()=>zoom(false);$('actual').onclick=()=>zoom(true);$('prev').onclick=()=>{if(current>0){current--;render()}};$('next').onclick=()=>{if(current<pages.length-1){current++;render()}};render();
</script></body></html>
